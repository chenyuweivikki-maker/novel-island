<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说岛 — 创作者的第二大脑</title>
<style>
/* ═══════════════════════════════════════════════════════════
   小说岛 · 设计系统（Figma 规范 v1.0 · 黑白极简 · 大气留白 · 温暖陪伴）
   变量与 Figma Variables 一一对应
   ═══════════════════════════════════════════════════════════ */
:root {
  --bg: #ffffff;            /* 页面底色 */
  --surface: #ffffff;       /* 卡片/面板 */
  --surface-2: #f7f7f7;     /* 次级底（输入框内、陪伴气泡） */
  --border: #e5e5e5;        /* 细线 */
  --border-strong: #d0d0d0; /* 强调线 */
  --text: #111111;          /* 主文字 / 主色=黑 */
  --text-2: #6b6b6b;        /* 次级文字 */
  --text-3: #9c9c9c;        /* 弱化文字/占位 */
  --on-primary: #ffffff;
  --radius: 12px;           /* 大控件 */
  --radius-sm: 8px;         /* 小控件 */
  --radius-pill: 999px;     /* 胶囊 */
  --space: 8px;             /* 8px 网格 */
  --font: Inter, -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font); background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; line-height: 1.6; font-size: 14px;
}
button { font-family: inherit; cursor: pointer; }
input, textarea { font-family: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

/* ── 全局壳 · Header ── */
.app { display: flex; flex-direction: column; height: 100vh; }
.header {
  height: 64px; flex-shrink: 0; display: flex; align-items: center;
  padding: 0 24px; justify-content: space-between;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
.header .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
.header .logo img { width: 36px; height: 19.8px; }
.nav { display: flex; gap: 32px; }
.nav a {
  font-size: 14px; color: var(--text-2); text-decoration: none; padding: 6px 0;
  border-bottom: 2px solid transparent; cursor: pointer; transition: color .15s;
}
.nav a:hover { color: var(--text); }
.nav a.active { color: var(--text); font-weight: 600; border-bottom-color: var(--text); }
.header .user { display: flex; align-items: center; gap: 8px; }
.btn-pill { font-size: 14px; padding: 9px 22px; border-radius: var(--radius-pill); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); }
.btn-pill.primary { background: var(--text); color: var(--on-primary); border-color: var(--text); }
.btn-pill.small { font-size: 13px; padding: 6px 16px; }
.user-name { font-size: 14px; font-weight: 500; }

/* ── 视图容器 ── */
.main { flex: 1; overflow: hidden; position: relative; }
.view { display: none; height: 100%; }
.view.active { display: block; }

/* ── 首页 ── */
.home {
  height: 100%; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 80px 24px 48px;
}
.home .mascot { width: 240px; max-width: 90vw; margin-bottom: 12px; }
.home h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 700; letter-spacing: 0.5px; margin: 16px 0 8px; }
.home .sub { color: var(--text-2); font-size: 15px; margin-bottom: 36px; text-align: center; }
.home-input {
  width: 100%; max-width: 640px; display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1.5px solid var(--text); border-radius: var(--radius-pill);
  padding: 14px 14px 14px 24px; transition: box-shadow .15s;
}
.home-input:focus-within { box-shadow: 0 0 0 3px rgba(17,17,17,.06); }
.home-input input { flex: 1; border: none; outline: none; font-size: 16px; color: var(--text); background: transparent; }
.home-input input::placeholder { color: var(--text-3); }
.home-input .send { width: 42px; height: 42px; border-radius: 8px; border: none; background: var(--text); color: #fff; font-size: 18px; flex-shrink: 0; transition: transform .12s; }
.home-input .send:hover { transform: scale(1.05); }
.home-chips { margin-top: 22px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 640px; }
.chip { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-2); font-size: 13px; padding: 8px 18px; border-radius: var(--radius-pill); transition: all .15s; }
.chip:hover { border-color: var(--text); color: var(--text); }
.home .recent { margin-top: 48px; width: 100%; max-width: 880px; }
.home .recent h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
.recent-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.home .foot { margin-top: 56px; color: var(--text-3); font-size: 12px; letter-spacing: 1px; }

/* ── 我的作品 ── */
.works { height: 100%; overflow-y: auto; padding: 40px 48px; }
.works .head { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.works h2 { font-size: 24px; font-weight: 600; margin-right: 12px; }
.seg { display: flex; padding: 4px; background: var(--surface-2); border-radius: 10px; gap: 4px; }
.seg button { border: none; background: transparent; font-size: 13px; color: var(--text-2); padding: 7px 16px; border-radius: var(--radius-sm); transition: all .15s; }
.seg button.active { background: var(--text); color: var(--on-primary); font-weight: 500; }
.works .spacer { flex: 1; }
.works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(277px, 1fr)); gap: 16px; }
.novel-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; transition: border-color .15s; cursor: pointer; }
.novel-card:hover { border-color: var(--text); }
.novel-card .tags { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
.tag { font-size: 11px; color: var(--text-2); border: 1px solid var(--border-strong); border-radius: var(--radius-pill); padding: 2px 10px; }
.tag.solid { background: var(--text); color: #fff; border-color: var(--text); }
.novel-card .date { margin-left: auto; font-size: 11px; color: var(--text-3); }
.novel-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.novel-card p { font-size: 13px; color: var(--text-2); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.novel-card .meta { margin-top: 14px; font-size: 12px; color: var(--text-3); }
.work-row {
  display: flex; align-items: center; gap: 24px; margin-top: 24px;
  border: 1px solid var(--border); border-radius: var(--radius); padding: 24px;
}
.work-row .cover { width: 64px; height: 80px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.work-row .info { flex: 1; min-width: 0; }
.work-row .info .tags { display: flex; gap: 6px; margin-bottom: 8px; }
.work-row h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.work-row .desc { font-size: 13px; color: var(--text-2); }
.work-row .actions { display: flex; gap: 8px; }
.empty-state { text-align: center; color: var(--text-3); padding: 80px 0; font-size: 14px; }
.empty-state img { width: 80px; margin-bottom: 16px; opacity: .8; }

/* ── 创作工作台（对话页） ── */
.chat { display: flex; height: 100%; position: relative; }
.view.active.chat { display: flex; } /* 覆盖 .view.active 的 display:block，保证侧栏+主区横排 */
.sidebar {
  width: 224px; flex-shrink: 0; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 8px 10px; transition: width .2s;
  overflow: hidden;
}
.sidebar.collapsed { width: 48px; padding: 8px 0; }
.sidebar.collapsed .hide-when-collapsed { display: none; }
.side-group { font-size: 11px; color: var(--text-3); letter-spacing: 1.5px; padding: 14px 8px 6px; white-space: nowrap; }
.side-item {
  display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: var(--radius-sm);
  font-size: 13.5px; color: var(--text-2); cursor: pointer; transition: background .12s; white-space: nowrap;
}
.side-item:hover { background: var(--surface-2); color: var(--text); }
.side-item.active { background: var(--text); color: var(--on-primary); }
.side-item .icon { font-size: 13px; width: 20px; text-align: center; flex-shrink: 0; }
.side-item .meta { margin-left: auto; font-size: 11px; color: var(--text-3); }
.side-item.active .meta { color: rgba(255,255,255,.7); }
.side-new {
  margin-top: auto; border: 1px dashed var(--border-strong); background: transparent;
  color: var(--text-2); font-size: 13px; padding: 9px; border-radius: var(--radius-sm);
  white-space: nowrap;
}
.side-new:hover { border-color: var(--text); color: var(--text); }
.sidebar.collapsed .side-new { border: none; padding: 8px 0; }
.side-collapse {
  position: absolute; left: 224px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 40px; border: 1px solid var(--border); border-left: none;
  background: var(--surface); border-radius: 0 8px 8px 0; color: var(--text-2);
  font-size: 11px; z-index: 5; transition: left .2s;
}
.sidebar.collapsed ~ .side-collapse, .sidebar.collapsed + .side-collapse { left: 48px; }

.chat-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chat-head {
  display: flex; align-items: center; gap: 10px; padding: 14px 28px; border-bottom: 1px solid var(--border);
}
.chat-head .title { font-size: 15px; font-weight: 600; }
.pill { font-size: 11px; padding: 3px 10px; border-radius: var(--radius-pill); border: 1px solid var(--border-strong); color: var(--text-2); background: var(--surface); }
.pill.companion { border-color: var(--text); color: var(--text); background: var(--surface-2); }
.pill.active-pill { background: var(--text); color: #fff; border-color: var(--text); }

.sub-tabs {
  display: flex; align-items: stretch; padding: 0 32px; height: 46px;
  border-bottom: 1px solid var(--border); gap: 24px; overflow-x: auto; display: none;
}
.sub-tabs.visible { display: flex; }
.sub-tab {
  border: none; background: transparent; font-size: 13px; color: var(--text-2);
  padding: 0 2px; border-bottom: 2px solid transparent; white-space: nowrap;
}
.sub-tab:hover { color: var(--text); }
.sub-tab.active { color: var(--text); font-weight: 700; border-bottom-color: var(--text); }

.pages { flex: 1; min-height: 0; position: relative; }
.page { display: none; height: 100%; overflow-y: auto; }
.page.active { display: block; }

/* 对话气泡 */
.msgs { padding: 28px; display: flex; flex-direction: column; gap: 18px; max-width: 780px; margin: 0 auto; }
.msg { display: flex; gap: 10px; max-width: 86%; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg .avatar {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 12px;
  background: var(--surface-2); border: 1px solid var(--border);
}
.msg.user .avatar { background: var(--text); color: #fff; border: none; }
.msg .body {
  padding: 12px 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.7;
  background: var(--surface-2); border: 1px solid var(--border);
}
.msg.user .body { background: var(--text); color: #fff; border: none; border-radius: 12px 12px 4px 12px; }
.msg .src { margin-top: 6px; font-size: 11px; color: var(--text-3); }
.msg.companion .body {
  background: var(--surface); border: 1px dashed var(--border-strong);
  border-left: 3px solid var(--text);
}
.msg.companion .tag { display: inline-block; font-size: 11px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); padding: 2px 8px; border-radius: var(--radius-pill); margin-bottom: 6px; }
.msg.typing .body::after { content: '…'; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0; } }

.chips-row { max-width: 780px; margin: 0 auto 8px; display: flex; gap: 8px; overflow-x: auto; padding: 0 28px; }
.chat-input {
  max-width: 780px; margin: 0 auto 20px; display: flex; align-items: center; gap: 12px;
  border: 1.5px solid var(--border-strong); border-radius: var(--radius-pill); padding: 6px 6px 6px 20px; background: var(--surface);
}
.chat-input:focus-within { border-color: var(--text); }
.chat-input.dragover { border-color: var(--text); box-shadow: 0 0 0 3px rgba(17,17,17,.06); }
.chat-input input { flex: 1; border: none; outline: none; font-size: 14.5px; padding: 8px 0; background: transparent; }
.chat-input input::placeholder { color: var(--text-3); }
.chat-input .send { width: 38px; height: 38px; border-radius: var(--radius-sm); border: none; background: var(--text); color: #fff; font-size: 16px; flex-shrink: 0; }
.attach-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 4px 12px; color: var(--text-2); }
.attach-chip button { border: none; background: none; color: var(--text-3); font-size: 12px; }

/* 通用 tab 内容 */
.tab-pad { padding: 32px; max-width: 880px; margin: 0 auto; }
.tab-pad h3 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.tab-actions { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }

/* 人设卡片三区 */
.char-layout { display: flex; gap: 24px; height: 100%; padding: 24px 32px; }
.char-list { width: 200px; flex-shrink: 0; border-right: 1px solid var(--border); padding-right: 16px; }
.char-list .cl-item { padding: 8px 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13.5px; color: var(--text-2); margin-bottom: 2px; }
.char-list .cl-item:hover { background: var(--surface-2); }
.char-list .cl-item.active { background: var(--text); color: #fff; font-weight: 500; }
.char-list .cl-new { margin-top: 12px; font-size: 13px; color: var(--text-3); border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); padding: 8px; text-align: center; cursor: pointer; }
.char-detail { flex: 1; display: flex; gap: 24px; min-width: 0; }
.portrait-col { width: 240px; flex-shrink: 0; }
.portrait-card {
  border: 1px dashed var(--border-strong); border-radius: var(--radius); aspect-ratio: 3/4;
  background: var(--surface-2); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px; text-align: center; padding: 16px; position: relative;
}
.portrait-card .silhouette { width: 56px; height: 76px; opacity: .5; }
.portrait-card .gen-btn { font-size: 13px; padding: 8px 16px; border-radius: var(--radius-sm); background: var(--text); color: #fff; border: none; }
.portrait-card .gen-hint { font-size: 11px; color: var(--text-3); }
.portrait-card.generating .spinner { width: 28px; height: 28px; border: 2px solid var(--border-strong); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.portrait-card.done .edit-tag { position: absolute; top: 8px; left: 8px; font-size: 11px; color: var(--text-2); border: 1px solid var(--border-strong); border-radius: var(--radius-pill); padding: 2px 8px; background: var(--surface); }
.portrait-states { display: flex; gap: 12px; margin-top: 16px; }
.portrait-states .ps { flex: 1; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; text-align: center; font-size: 11px; color: var(--text-2); }
.ps .ps-card { height: 72px; border: 1px dashed var(--border-strong); border-radius: 8px; background: var(--surface-2); margin-bottom: 6px; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 10px; }
.ps:nth-child(2) .ps-card::after { content: ''; width: 16px; height: 16px; border: 2px solid var(--border-strong); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; }
.ps:nth-child(3) .ps-card { border: 1px solid var(--border-strong); }
.ps:nth-child(3) .ps-card::before { content: '👤'; font-size: 22px; }
.info-col { flex: 1; min-width: 0; }
.info-section { margin-bottom: 20px; }
.info-section .sec-title { font-size: 11px; color: var(--text-3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.info-section .sec-body { font-size: 14px; line-height: 1.7; }
.rel-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.rel-tag { font-size: 12px; color: var(--text-2); border: 1px solid var(--border-strong); border-radius: var(--radius-pill); padding: 3px 10px; cursor: pointer; }
.rel-tag:hover { border-color: var(--text); color: var(--text); }

/* 关系图 */
.graph-wrap { padding: 24px 32px; height: 100%; position: relative; }
#graphSvg { width: 100%; height: 100%; }
.graph-hint { position: absolute; left: 32px; bottom: 24px; font-size: 11px; color: var(--text-3); }

/* 时间线 / 章纲：思维导图 */
.mm { position: relative; padding: 24px 32px; }
.mm-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border); }
.mm-item { position: relative; width: 46%; margin-bottom: 20px; }
.mm-item.left { margin-right: auto; }
.mm-item.right { margin-left: auto; }
.mm-item .mm-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.mm-item .mm-card:hover { border-color: var(--border-strong); }
.mm-item .mm-title { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.timeline-badge { color: var(--text); font-weight: 600; }
.mm-empty { text-align: center; color: var(--text-3); padding: 60px 0; }

/* 大纲 */
.outline-wrap { padding: 32px; max-width: 880px; margin: 0 auto; }
.outline-wrap textarea { width: 100%; min-height: 420px; border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 20px; font-size: 14px; line-height: 1.8; resize: vertical; outline: none; }
.outline-wrap textarea:focus { border-color: var(--text); }
.outline-status { font-size: 12px; color: var(--text-3); margin-left: 12px; }

/* 背景资料 */
.bg-category { margin-bottom: 24px; }
.bg-category-title { font-size: 11px; color: var(--text-3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
.bg-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 8px; position: relative; }
.bg-card-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.bg-card-content { font-size: 13px; color: var(--text-2); }
.bg-card-del { position: absolute; top: 10px; right: 12px; border: none; background: none; color: var(--text-3); font-size: 12px; cursor: pointer; }
.bg-card-del:hover { color: var(--text); }

/* 写作 */
.write-wrap { padding: 32px; max-width: 880px; margin: 0 auto; }
.write-wrap textarea { width: 100%; min-height: 380px; border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 20px; font-size: 14px; line-height: 1.8; resize: vertical; outline: none; }
.write-wrap textarea:focus { border-color: var(--text); }
.chapter-list { margin-top: 16px; }
.chunk-item { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 6px; font-size: 13px; }
.save-result { margin-top: 12px; font-size: 13px; color: var(--text-2); white-space: pre-wrap; }

/* 登录 */
.login-wrap { height: 100%; display: flex; align-items: center; justify-content: center; }
.login-card { width: 400px; text-align: center; }
.login-card img { width: 104px; margin-bottom: 8px; }
.login-card h2 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
.login-card .sub { font-size: 14px; color: var(--text-2); margin-bottom: 28px; }
.login-field { margin-bottom: 14px; text-align: left; }
.login-field input { width: 100%; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 14px; outline: none; }
.login-field input:focus { border-color: var(--text); }
.login-field .err { font-size: 12px; color: var(--text); font-weight: 600; margin-top: 4px; }
.login-btn { width: 100%; font-size: 14px; padding: 12px; border-radius: var(--radius-pill); background: var(--text); color: #fff; border: none; margin-top: 8px; }
.login-switch { margin-top: 16px; font-size: 13px; color: var(--text-2); }
.login-switch a { color: var(--text); font-weight: 500; cursor: pointer; }
.login-agree { margin-top: 32px; font-size: 11px; color: var(--text-3); }

/* 弹窗 */
.modal-mask { position: fixed; inset: 0; background: rgba(17,17,17,.35); display: none; align-items: center; justify-content: center; z-index: 100; cursor: pointer; }
.modal-mask.show { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius); width: 420px; max-width: 92vw; padding: 24px; box-shadow: 0 4px 32px rgba(0,0,0,.08); cursor: default; }
.modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.modal-field { margin-bottom: 12px; }
.modal-field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
.modal-field input, .modal-field textarea { width: 100%; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px; outline: none; }
.modal-field input:focus, .modal-field textarea:focus { border-color: var(--text); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

/* 状态 */

@media (max-width: 900px) {

  .char-layout { flex-direction: column; }

}

window.addEventListener('error', function (e) {
  var b = document.getElementById('jsErrBanner');

<body>
<div class="app">
  <!-- ═══════ 全局 Header ═══════ -->
  <header class="header">
    <div class="logo"><img src="/static/xiaoshuomao-official.svg" alt="小说猫"><span>小说岛</span></div>

      <button class="btn-pill" id="btnLoginHeader">登录</button>
    </div>

  <main class="main">
    <!-- ═══════ 首页 ═══════ -->

        <button class="chip" data-q="看看我的灵感库">看看我的灵感库</button>
        <button class="chip" data-q="人设总是崩，帮我检查">人设总是崩，帮我检查</button>
      </div>
      <div class="recent" id="recentBox" style="display:none">
        <h2>最近作品</h2>
        <div class="recent-row" id="recentList"></div>

      <p class="foot">写不下去的时候，我都在。</p>

    <!-- ═══════ 我的作品 ═══════ -->
    <section class="view works" id="view-works">
      <div class="head">

        <div class="seg" id="genreSeg">
          <button class="active" data-g="全部">全部</button>
          <button data-g="奇幻">奇幻</button>

        </div>
        <div class="seg" id="statusSeg">
          <button class="active" data-s="全部">全部</button>

    <!-- ═══════ 创作工作台 ═══════ -->
    <section class="view chat" id="view-chat">
      <aside class="sidebar" id="sidebar">
        <div class="side-group hide-when-collapsed">小说项目</div>

        <div class="side-group hide-when-collapsed">灵感库</div>
        <div class="side-item hide-when-collapsed"><span class="icon">💡</span>人设灵感<span class="meta">12</span></div>
        <div class="side-item hide-when-collapsed"><span class="icon">📜</span>剧情灵感<span class="meta">8</span></div>
        <div class="side-item hide-when-collapsed"><span class="icon">✒️</span>金句<span class="meta">5</span></div>
        <button class="side-new" id="btnNewProjectSide">＋ 新建项目</button>
      </aside>
      <button class="side-collapse" id="btnSideCollapse" title="收起/展开侧栏">‹</button>

      <div class="chat-main">
        <div class="chat-head">
          <span class="title" id="chatTitle">写作Agent</span>
          <span class="pill" id="pillWriting">写作中</span>
          <button class="pill companion" id="pillCompanion">♡ 陪伴模式</button>

        <div class="sub-tabs" id="subTabs">

          <button class="sub-tab" data-subpage="chapter_outline">章纲</button>

        <div class="pages">
          <!-- 对话 -->
          <div class="page active" id="page-chat">
            <div class="msgs" id="msgList"></div>
            <div class="chips-row">
              <button class="chip" data-q="检查这段逻辑">检查这段逻辑</button>
              <button class="chip" data-q="人设崩了吗">人设崩了吗</button>
              <button class="chip" data-q="给我三个灵感">给我三个灵感</button>
              <button class="chip" data-q="生成章纲">生成章纲</button>

            <div class="graph-wrap">
              <svg id="graphSvg" viewBox="0 0 800 480"></svg>
              <div class="graph-hint">拖拽可移动 · 滚轮缩放 · 点击节点查看人设卡片</div>

          <!-- 大纲 -->
          <div class="page" id="page-outline">
            <div class="outline-wrap">
              <div class="tab-actions">
                <h3 style="margin:0">全文大纲</h3>
                <span class="status" id="outlineSaveResult"></span>
                <span class="spacer"></span>

          <div class="page" id="page-backgrounds">

                <button class="btn-pill primary" id="btnSaveChapter">保存章节并更新知识库</button>
                <span class="status">卡文检测：编辑停顿超 5 分钟会提醒</span>
              </div>
              <div class="chapter-list" id="chapterList"></div>

          </div>
        </div>
      </div>

    <!-- ═══════ 登录 / 注册 ═══════ -->
    <section class="view" id="view-login">
      <div class="login-wrap">
        <div class="login-card">
          <img src="/static/xiaoshuomao-official.svg" alt="小说猫">

          <div id="loginForm">
            <div class="login-field"><input id="loginEmail" placeholder="请输入邮箱"></div>
            <div class="login-field"><input id="loginPwd" type="password" placeholder="请输入密码"></div>

<!-- ═══════ 新建小说弹窗 ═══════ -->
<div class="modal-mask" id="newNovelModal">
  <div class="modal">
    <div class="modal-title">新建小说 · 填写基本信息，开始你的创作</div>
    <div class="modal-field"><label>小说名称</label><input id="newNovelTitle" placeholder="给你的故事起个名字…"></div>
    <div class="modal-field"><label>预计总字数</label><input id="newNovelExpectedWords" placeholder="例：200,000"></div>
    <div class="modal-field"><label>每章字数</label><input id="newNovelChapterWords" placeholder="例：3,000"></div>
    <div class="modal-actions">
      <button class="btn-pill" id="btnCancelNewNovel">取消</button>
      <button class="btn-pill primary" id="btnConfirmNewNovel">创建</button>
    </div>
  </div>
</div>

<!-- ═══════ 背景资料弹窗 ═══════ -->
<div class="modal-mask" id="bgModal">
  <div class="modal">
    <div class="modal-title">添加背景资料</div>
    <div class="modal-field"><label>分类（如：世界观 / 人物 / 地点 / 物品）</label><input id="bgCategory" placeholder="世界观"></div>
    <div class="modal-field"><label>标题</label><input id="bgTitle" placeholder="如：第三纪元设定"></div>
    <div class="modal-field"><label>内容</label><textarea id="bgContent" rows="4" placeholder="粘贴或写下这段背景资料…"></textarea></div>
    <div class="modal-actions">
      <button class="btn-pill" id="btnCancelBg">取消</button>
      <button class="btn-pill primary" id="btnConfirmBg">保存</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// 小说岛 · 前端（设计系统 v1.0 重构版）
// ═══════════════════════════════════════════════════════════
const API_BASE = 'http://localhost:8000';

// ===== STATE =====
let KB = { chunks: [], entities: [], characters: [], relationships: [], ready: false };
let currentNovelId = null;
let currentSubPage = 'chat';
let companionMode = false;
let loginMode = 'login'; // login | register
let messages = [];       // 对话消息列表

// ===== API =====
async function apiCall(path, body) {
  const resp = await fetch(`${API_BASE}${path}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  if (!resp.ok) throw new Error(`API ${resp.status}: ${await resp.text()}`);
  return resp.json();
}
async function apiGet(path) {
  const resp = await fetch(`${API_BASE}${path}`);
  if (!resp.ok) throw new Error(`API ${resp.status}: ${await resp.text()}`);
  return resp.json();
}

// ===== 视图切换 =====
function showView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.dataset.view === view));
  if (view === 'works') { loadWorks(); }
  if (view === 'chat') {
    if (!currentNovelId) selectDefaultChat(); // 无选中小说时初始化默认对话态
    renderSidebar();
    if (currentNovelId) refreshKBViews();
  }
  if (view === 'home') { loadRecent(); }
}
document.querySelector('.logo').addEventListener('click', () => showView('home'));
document.querySelectorAll('.nav a').forEach(a => a.addEventListener('click', () => {
  if (a.textContent.trim() === '社区') { alert('社区即将上线'); return; }
  showView(a.dataset.view === 'works' && a.textContent.trim() === '我的作品' ? 'works' : a.dataset.view);
}));

// ===== 首页 =====
function loadRecent() {
  apiGet('/api/novels').then(data => {
    const novels = data.novels || [];
    const box = document.getElementById('recentBox');
    if (novels.length === 0) { box.style.display = 'none'; return; }
    box.style.display = 'block';
    document.getElementById('recentList').innerHTML = novels.slice(0, 3).map(n => `
      <div class="work-row" style="margin-top:0">
        <div class="cover">📖</div>
        <div class="info">
          <div class="tags"><span class="tag">连载中</span></div>
          <h3>${esc(n.title)}</h3>
          <div class="desc">${(n.total_words || 0).toLocaleString()} 字 · 上次编辑 ${n.updated_at ? timeAgo(n.updated_at) : '—'}</div>
        </div>
        <div class="actions">
          <button class="btn-pill small" onclick="enterNovel(${n.id}, '${escAttr(n.title)}')">继续写</button>
        </div>
      </div>
    `).join('');
  }).catch(() => {});
}
function timeAgo(iso) {
  if (!iso) return '—';
  const d = new Date(iso), now = new Date();
  const h = Math.floor((now - d) / 3600000);
  if (h < 1) return Math.max(1, Math.floor((now - d) / 60000)) + ' 分钟前';
  if (h < 24) return h + ' 小时前';
  return Math.floor(h / 24) + ' 天前';
}
function enterNovel(id, title) {
  showView('chat');
  selectNovel(id, title);
}
document.getElementById('homeSend').addEventListener('click', () => {
  const q = document.getElementById('homeInput').value.trim();
  if (!q) return;
  showView('chat');
  selectDefaultChat();
  document.getElementById('qaInput').value = q;
  ask();
});
document.getElementById('homeInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('homeSend').click(); });
document.querySelectorAll('#view-home .chip, .chips-row .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const q = chip.dataset.q;
    if (document.getElementById('view-home').classList.contains('active')) {
      showView('chat'); selectDefaultChat();
    }
    document.getElementById('qaInput').value = q;
    ask();
  });
});

// ===== 我的作品 =====
function loadWorks() {
  apiGet('/api/novels').then(data => {
    const novels = data.novels || [];
    const g = document.querySelector('#genreSeg .active').dataset.g;
    const s = document.querySelector('#statusSeg .active').dataset.s;
    const filtered = novels.filter(n =>
      (g === '全部' || n.genre === g) && (s === '全部' || n.status === s)
    );
    const wrap = document.getElementById('worksContent');
    if (filtered.length === 0) {
      wrap.innerHTML = `<div class="empty-state"><img src="/static/xiaoshuomao-official.svg"><br>还没有作品，点击「新建小说」开始你的第一本</div>`;
      return;
    }
    wrap.innerHTML = `
      <div class="works-grid">
        ${filtered.map(n => `
          <div class="novel-card" onclick="enterNovel(${n.id}, '${escAttr(n.title)}')">
            <div class="tags"><span class="tag">${esc(n.genre || '未分类')}</span><span class="tag">${esc(n.status || '连载中')}</span><span class="date">${esc(n.updated_at ? n.updated_at.slice(5, 10) : '')}</span></div>
            <h3>${esc(n.title)}</h3>
            <p>${esc(n.description || '还没有简介，开始写第一章吧。')}</p>
            <div class="meta">第 ${n.chapter_count || 0} 章 · ${(n.total_words || 0).toLocaleString()} 字</div>
          </div>`).join('')}
      </div>
      ${filtered[0] ? `
      <div class="work-row">
        <div class="cover">📖</div>
        <div class="info">
          <div class="tags"><span class="tag solid">热门</span><span class="tag">连载</span></div>
          <h3>${esc(filtered[0].title)}</h3>
          <div class="desc">第 ${filtered[0].chapter_count || 0} 章 · ${(filtered[0].total_words || 0).toLocaleString()} 字 · 上次编辑 ${timeAgo(filtered[0].updated_at)}</div>
        </div>
        <div class="actions">
          <button class="btn-pill small" onclick="enterNovel(${filtered[0].id}, '${escAttr(filtered[0].title)}')">继续写</button>
        </div>
      </div>` : ''}
    `;
  }).catch(e => {
    document.getElementById('worksContent').innerHTML = `<div class="empty-state">加载失败: ${esc(e.message)}<br><br>请确认后端已启动（localhost:8000）</div>`;
  });
}
document.querySelectorAll('#genreSeg button, #statusSeg button').forEach(b => b.addEventListener('click', () => {
  const seg = b.parentElement;
  seg.querySelectorAll('button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  loadWorks();
}));

// ===== 侧栏 =====
function renderSidebar() {
  apiGet('/api/novels').then(data => {
    const novels = data.novels || [];
    const list = document.getElementById('projectList');
    if (novels.length === 0) {
      list.innerHTML = '<div class="side-item hide-when-collapsed" style="cursor:default;color:var(--text-3)">还没有项目，点下方＋新建</div>';
      return;
    }
    list.innerHTML = novels.map(n => `
      <div class="side-item ${n.id === currentNovelId ? 'active' : ''}" data-novel-id="${n.id}" draggable="true">
        <span class="icon">📘</span>
        <span class="hide-when-collapsed side-title">${esc(n.title)}</span>
        <span class="hide-when-collapsed meta">${((n.total_words || 0) / 10000).toFixed(1)}万字</span>
      </div>`).join('');
    list.querySelectorAll('.side-item').forEach(item => {
      item.addEventListener('click', e => {
        if (e.target.classList.contains('side-edit')) return;
        selectNovel(Number(item.dataset.novelId), item.querySelector('.side-title').textContent);
      });
      item.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', item.dataset.novelId));
      item.addEventListener('dragover', e => e.preventDefault());
      item.addEventListener('drop', e => {
        e.preventDefault();
        reorderProjects(Number(e.dataTransfer.getData('text/plain')), Number(item.dataset.novelId));
      });
    });
  }).catch(() => {});
}
document.getElementById('btnSideCollapse').addEventListener('click', () => {
  const sb = document.getElementById('sidebar');
  const collapsed = sb.classList.toggle('collapsed');
  document.getElementById('btnSideCollapse').textContent = collapsed ? '›' : '‹';
});

// ===== 新建小说 =====
function openNewNovel() { document.getElementById('newNovelModal').classList.add('show'); }
document.getElementById('btnNewProjectWorks').addEventListener('click', openNewNovel);
document.getElementById('btnNewProjectSide').addEventListener('click', openNewNovel);
document.getElementById('btnCancelNewNovel').addEventListener('click', () => document.getElementById('newNovelModal').classList.remove('show'));
document.getElementById('btnConfirmNewNovel').addEventListener('click', async () => {
  const title = document.getElementById('newNovelTitle').value.trim();
  if (!title) { alert('请输入小说名称'); return; }
  const expectedWords = parseInt(document.getElementById('newNovelExpectedWords').value) || 0;
  const chapterWords = parseInt(document.getElementById('newNovelChapterWords').value) || 0;
  try {
    const data = await apiCall('/api/novel', { title, expected_words: expectedWords, chapter_words: chapterWords });
    document.getElementById('newNovelModal').classList.remove('show');
    showView('chat');
    renderSidebar();
    selectNovel(data.novel_id, title);
    showAgentWelcome(title);
  } catch (e) { alert('创建失败: ' + e.message); }
});

// ===== 选中小说 / 默认对话 =====
function selectNovel(id, title) {
  currentNovelId = id;
  document.getElementById('subTabs').classList.add('visible');
  document.getElementById('chatTitle').textContent = title;
  switchSubPage('chat');
  renderSidebar();
  refreshKBViews();
  loadChapters();
  // 进入小说：对话区空则给欢迎语，避免「没反应」的错觉
  if (document.getElementById('msgList').children.length === 0) {
    appendMsg('agent', '正在基于《' + title + '》工作。可以问我关于设定、逻辑、灵感的问题，或把素材拖进输入框，我自动解析入库。');
  }
}
function selectDefaultChat() {
  currentNovelId = null;
  document.getElementById('subTabs').classList.remove('visible');
  document.getElementById('chatTitle').textContent = '写作Agent';
  switchSubPage('chat');
}

// ===== 二级 tab =====
document.querySelectorAll('.sub-tab').forEach(tab => tab.addEventListener('click', () => switchSubPage(tab.dataset.subpage)));
function switchSubPage(subpage) {
  currentSubPage = subpage;
  document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const tab = document.querySelector(`.sub-tab[data-subpage="${subpage}"]`);
  if (tab) tab.classList.add('active');
  const page = document.getElementById('page-' + subpage);
  if (page) page.classList.add('active');
  if (subpage === 'chars' || subpage === 'graph') refreshKBViews();
  if (subpage === 'timeline') renderTimeline();
  if (subpage === 'chapter_outline') renderChapterOutlines();

}

// ===== 对话 =====
function appendMsg(role, text, opts = {}) {
  messages.push({ role, text, ...opts });
  const list = document.getElementById('msgList');
  const cls = role === 'user' ? 'msg user' : (opts.companion ? 'msg companion' : 'msg');
  const avatar = role === 'user' ? '我' : '猫';
  const src = opts.src ? `<div class="src">来源：${opts.src}</div>` : '';
  const tag = opts.companion ? `<span class="tag">♡ 陪伴模式</span><br>` : '';
  const div = document.createElement('div');
  div.className = cls;
  div.innerHTML = `<div class="avatar">${avatar}</div><div class="body">${tag}${esc(text).replace(/\n/g, '<br>')}${src}</div>`;
  list.appendChild(div);
  list.scrollTop = list.scrollHeight;
}
function esc(s) { return s == null ? '' : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function escAttr(s) { return esc(s).replace(/'/g, '&#39;'); }

let attachedFile = null;
const inputWrap = document.getElementById('chatInputWrap');
// 素材拖放
inputWrap.addEventListener('dragover', e => { e.preventDefault(); inputWrap.classList.add('dragover'); });
inputWrap.addEventListener('dragleave', () => inputWrap.classList.remove('dragover'));
inputWrap.addEventListener('drop', e => {
  e.preventDefault();
  inputWrap.classList.remove('dragover');
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if (file && /\.(txt|md)$/i.test(file.name)) {
    const reader = new FileReader();
    reader.onload = () => {
      attachedFile = { name: file.name, size: file.size, text: String(reader.result).slice(0, 50000) };
      document.getElementById('attachArea').style.display = 'block';
      document.getElementById('attachArea').innerHTML =
        `<span class="attach-chip">📎 ${esc(file.name)}（${(file.size / 1024).toFixed(1)}KB）<button onclick="clearAttach()">×</button></span>`;
    };
    reader.readAsText(file);
  } else if (file) {
    alert('当前支持 .txt / .md 文本素材（.docx/.pdf 二期支持）');
  }
});
function clearAttach() {
  attachedFile = null;
  document.getElementById('attachArea').style.display = 'none';
  document.getElementById('attachArea').innerHTML = '';
}

async function ask() {
  const input = document.getElementById('qaInput');
  const query = input.value.trim();
  if (!query && !attachedFile) return;
  const body = { query: query || '（素材解析）', top_k: 5 };
  if (currentNovelIdNum()) body.novel_id = currentNovelIdNum();
  if (attachedFile) body.material = attachedFile.text; // 对话式建库：素材随消息发送，后端解析入库

  appendMsg('user', query || `📎 ${attachedFile.name}`);
  clearAttach();
  input.value = '';

  var askBtn = document.getElementById('btnAsk');
  var askOrig = askBtn.textContent;
  askBtn.textContent = '…';
  askBtn.disabled = true;
  const typing = document.createElement('div');
  typing.className = 'msg typing';
  typing.innerHTML = '<div class="avatar">猫</div><div class="body">思考中…</div>';
  document.getElementById('msgList').appendChild(typing);
  document.getElementById('msgList').scrollTop = 99999;

  try {
    const data = await apiCall('/api/kb/ask', body);
    typing.remove();
    const isCompanion = companionMode || /抱抱|陪陪|我在|歇一歇|抱抱你/.test(data.answer || '');
    appendMsg('agent', data.answer, {
      companion: isCompanion,
      src: data.sources && data.sources.length ? '片段#' + data.sources.slice(0, 3).map(s => s.chunk_id + 1).join(' · #') : ''
    });
  } catch (e) {
    typing.remove();
    appendMsg('agent', '出错了：' + e.message + '（请确认后端已启动）');
  } finally {
    askBtn.textContent = askOrig;
    askBtn.disabled = false;
  }
}
document.getElementById('btnAsk').addEventListener('click', ask);
document.getElementById('qaInput').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
document.getElementById('pillCompanion').addEventListener('click', () => {

async function fetchCharacters() {
  try {
    const params = currentNovelIdNum() ? `?novel_id=${currentNovelIdNum()}` : '';
    const data = await apiGet('/api/graph' + params);
    return (data.entities || []).map(ent => {
      const name = typeof ent === 'string' ? ent : (ent.name || '');
      const persona = (typeof ent === 'object' && ent.persona) ? ent.persona : {};
      return {
        name, persona,
        relations: (data.relations || []).filter(r => r.source === name || r.target === name)
      };
    });
  } catch (e) { return []; }
}

// ===== 关系图（黑白风） =====
function renderRelationshipGraph() {
  const svg = document.getElementById('graphSvg');
  if (!KB.characters.length) {
    svg.innerHTML = '<text x="400" y="240" text-anchor="middle" fill="#9c9c9c" font-size="13">还没有人物数据，保存章节后自动生成</text>';
    return;
  }
  const cx = 400, cy = 240, r = 150;
  const main = KB.characters[0];
  const others = KB.characters.slice(1);
  let html = '';
  // 连线
  for (const char of KB.characters) {
    for (const rel of char.relations || []) {
      const target = KB.characters.find(c => c.name === rel.target || c.name === rel.source);
      if (!target || target.name === char.name) continue;
      const pos = c => c === main ? [cx, cy] : [cx + r * Math.cos((others.indexOf(c) + 1) * 2 * Math.PI / (others.length + 1)), cy + r * Math.sin((others.indexOf(c) + 1) * 2 * Math.PI / (others.length + 1))];
      const [x1, y1] = pos(char), [x2, y2] = pos(target);
      const relName = rel.source === char.name ? rel.relation : rel.relation;
      html += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#d0d0d0" stroke-width="${1 + (rel.weight || 3) * 0.15}"/>`;
      html += `<text x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 - 4}" text-anchor="middle" fill="#6b6b6b" font-size="10">${esc(relName)}</text>`;
    }
  }
  // 节点
  for (let i = 0; i < KB.characters.length; i++) {
    const char = KB.characters[i];
    const isMain = i === 0;
    const [x, y] = isMain ? [cx, cy] : [cx + r * Math.cos(i * 2 * Math.PI / KB.characters.length), cy + r * Math.sin(i * 2 * Math.PI / KB.characters.length)];
    const nodeR = isMain ? 34 : 24;
    html += `
      <circle cx="${x}" cy="${y}" r="${nodeR}" fill="#fff" stroke="#111" stroke-width="1.5"/>
      <text x="${x}" y="${y + 4}" text-anchor="middle" fill="#111" font-size="${isMain ? 13 : 11}" font-weight="${isMain ? 600 : 400}">${esc(char.name)}</text>`;
  }
  svg.innerHTML = html;
}

function renderMindMap(container, items, labelFn, emptyText) {
  if (!items || items.length === 0) {
    container.innerHTML = `<div class="mm-empty">${emptyText || '暂无内容'}</div>`;
    return;
  }
  container.innerHTML = items.map((item, i) => {
    const side = i % 2 === 0 ? 'left' : 'right';
    return `<div class="mm-item ${side}">
      <div class="mm-card">
        <div class="mm-title">${labelFn(item, i)}</div>
        <div>${esc(item.content || item.summary || item.outline || '')}</div>
      </div>
    </div>`;
  }).join('');
}
async function renderTimeline() {
  const container = document.getElementById('timelineList');

    const params = currentNovelIdNum() ? `?novel_id=${currentNovelIdNum()}` : '';

    renderMindMap(container, items, (item, i) => {

async function loadBackgrounds() {
  const container = document.getElementById('backgroundList');

    const data = await apiGet(`/api/novel/${currentNovelId}/backgrounds`);

    if (!keys.length) { container.innerHTML = '<div class="empty-state">还没有背景资料，点右上角添加</div>'; return; }
    container.innerHTML = keys.map(cat => `
      <div class="bg-category">
        <div class="bg-category-title">${esc(cat)}</div>
        ${grouped[cat].map(bg => `
          <div class="bg-card">
            ${bg.title ? `<div class="bg-card-title">${esc(bg.title)}</div>` : ''}
            <div class="bg-card-content">${esc(bg.content)}</div>
            <button class="bg-card-del" onclick="deleteBackground(${bg.id})">删除</button>
          </div>`).join('')}
      </div>`).join('');
  } catch (e) {
    container.innerHTML = '<div class="empty-state">加载失败: ' + esc(e.message) + '</div>';
  }
}
